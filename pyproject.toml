[project]
name = "agent-self-verify"
version = "0.1.0"
description = "Self-verification harness for AI agents — evidence chains before accepting outputs"
authors = [{ name = "wwb-bill" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-self-verify = "agent_self_verify.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_self_verify*"]
